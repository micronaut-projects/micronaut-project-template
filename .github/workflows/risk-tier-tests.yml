name: Risk tier script tests
# Runs the unit tests of .github/scripts/risk-tier.py. Only the template runs them: the test file is not synced.
on:
  push:
    paths:
      - ".github/scripts/risk-tier.py"
      - ".github/scripts/test_risk_tier.py"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  pull_request:
    paths:
      - ".github/workflows/risk-tier-tests.yml"
      - ".github/scripts/risk-tier.py"
      - ".github/scripts/test_risk_tier.py"
      - ".github/PULL_REQUEST_TEMPLATE.md"

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'micronaut-projects/micronaut-project-template'
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "🧪 Run the tests"
        run: python3 .github/scripts/test_risk_tier.py -v

  live-jev:
    # Classifies this pull request with the real Jev API, without changing labels, so that a change to the request
    # format fails here before it reaches every repository. Fork pull requests get no secrets, so it only runs for
    # branches of this repository.
    if: >-
      github.repository == 'micronaut-projects/micronaut-project-template' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "🏷 Classify this pull request with Jev"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python3 .github/scripts/risk-tier.py --config .github/risk-tiers.yml event --dry-run
      - name: "📊 Replay merged pull requests (temporary)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          for repo in serialization security; do
            python3 .github/scripts/risk-tier.py --config /dev/null replay "micronaut-projects/micronaut-$repo" \
              --since 2026-10-28 --until 2026-11-25 > "replay-$repo.json"
            python3 - "replay-$repo.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          print(sys.argv[1], d["counts"])
          for p in d["pull_requests"]:
              j = p["jev"] or {}
              print(f'#{p["number"]}\trules {p["rules_tier"]}\tfinal {p["tier"]}\tjev {j.get("choice")} '
                    f'{j.get("probabilities")}\tapi {j.get("public_api", 0):.2f}\tbreaking {j.get("breaking", 0):.2f}\t{p["title"][:70]}')
          PY
          done
      - name: "📦 Upload replay results"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jev-replay
          path: replay-*.json
