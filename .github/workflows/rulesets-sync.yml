name: Rulesets sync
# Applies the shared branch rulesets in .github/rulesets.json to every repository of the organisation that is not
# archived, whether or not files-sync.yml syncs its files, and deletes every other repository ruleset and classic branch
# protection rule, so that the same merge requirements hold everywhere. See "Files sync" in MAINTAINING.md.
on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Repository name, such as micronaut-core. Leave empty for every repository.'
        required: false
        type: string
      dry_run:
        description: 'Only print what would change.'
        required: false
        type: boolean
        default: true
  schedule:
    - cron: '0 3 * * *'
      timezone: 'Europe/Madrid'

permissions:
  contents: read

concurrency:
  group: rulesets-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'micronaut-projects/micronaut-project-template'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Sync rulesets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ORG: ${{ github.repository_owner }}
          ONLY: ${{ inputs.repository }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          set -uo pipefail
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ -n "${ONLY}" ]; then
            repos="${ONLY}"
          else
            repos="$(gh api --paginate "orgs/${ORG}/repos?type=all&per_page=100" \
              --jq '.[] | select(.archived | not) | .name')" || { echo "::error::Could not list repositories."; exit 1; }
          fi

          failed=()
          for repo in ${repos}; do
            echo "::group::${repo}"
            if ! .github/scripts/sync-rulesets.sh "${ORG}/${repo}" .github/rulesets.json --prune ${DRY_RUN}; then
              failed+=("${repo}")
            fi
            echo "::endgroup::"
          done

          echo "Synced $(wc -w <<< "${repos}") repositories ${DRY_RUN:+(dry run)}" >> "${summary}"
          if [ "${#failed[@]}" -gt 0 ]; then
            printf '\nFailed: %s\n' "${failed[*]}" >> "${summary}"
            echo "::error::Rulesets sync failed for ${failed[*]}"
            exit 1
          fi
