# WARNING: Do not edit this file directly. Instead, go to:
#
# https://github.com/micronaut-projects/micronaut-project-template/tree/master/.github/workflows
#
# and edit them there. Note that it will be sync'ed to all the Micronaut repos
#
# Sonar analysis for pull requests raised from forks.
#
# GitHub never exposes repository secrets to a `pull_request` event raised from a
# fork, so the "Run static analysis" step in gradle.yml is skipped there and the
# "SonarCloud Code Analysis" check is never reported. Where that check is required
# by a ruleset, contributor pull requests stay blocked forever.
#
# This workflow lets someone with write access run the analysis on demand, either
# from the Actions tab or by commenting "/sonar" on the pull request. The build
# scripts of the pull request are executed with SONAR_TOKEN in the environment, so
# the diff MUST be reviewed first: the human trigger IS the security boundary.
name: Sonar PR
on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number. Review the diff first - this runs the pull request build with SONAR_TOKEN.'
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

# One analysis per pull request at a time.
concurrency:
  group: sonar-pr-${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # Authorisation and pull request resolution are kept in their own job so that a
  # refusal stops the run outright. A step cannot skip the rest of its job, so
  # doing this inline would leave an unauthorised trigger running the analysis.
  authorize:
    name: "authorize"
    # `startsWith(comment.body, '/sonar')` is deliberately coarse: a false
    # negative here is a silent no-op that looks like a broken workflow, whereas
    # a false positive only starts this cheap job, which then rejects the exact
    # command below. Anything stricter risks missing trailing whitespace or a
    # line ending in the comment body.
    if: >-
      github.repository != 'micronaut-projects/micronaut-project-template' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event.issue.pull_request != null &&
          startsWith(github.event.comment.body, '/sonar')))
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.command.outputs.proceed }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_branch: ${{ steps.pr.outputs.head_branch }}
      base_branch: ${{ steps.pr.outputs.base_branch }}
    env:
      SONAR_TOKEN_AVAILABLE: ${{ secrets.SONAR_TOKEN != '' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.issue.number }}
    steps:
      - name: "❓ Check this is the /sonar command"
        id: command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          proceed=true
          if [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
            command=$(printf '%s' "$COMMENT_BODY" | head -n 1 | tr -d '\r' | xargs)
            if [ "$command" != "/sonar" ]; then
              echo "Ignoring comment: '${command}' is not the '/sonar' command."
              proceed=false
            fi
          fi
          echo "proceed=${proceed}" >> "$GITHUB_OUTPUT"

      - name: "🔐 Verify the requester has write access"
        if: steps.command.outputs.proceed == 'true'
        run: |
          if [ "$SONAR_TOKEN_AVAILABLE" != "true" ]; then
            echo "::error::SONAR_TOKEN is not configured for this repository."
            exit 1
          fi
          # A non-collaborator makes this endpoint answer 404, so the exit code
          # has to be inspected before the permission value: otherwise the step
          # dies on gh's own error and never reports why the run was refused.
          if ! permission=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission" -q '.permission' 2>"${RUNNER_TEMP}/perm.err"); then
            echo "::error::Unable to determine ${GITHUB_ACTOR}'s permission on ${GITHUB_REPOSITORY}; they are most likely not a collaborator. $(cat "${RUNNER_TEMP}/perm.err")"
            exit 1
          fi
          echo "${GITHUB_ACTOR} has '${permission}' permission"
          case "$permission" in
            admin|write) ;;
            *)
              echo "::error::${GITHUB_ACTOR} has '${permission}' permission on ${GITHUB_REPOSITORY}; running Sonar requires write access."
              exit 1
              ;;
          esac

      - name: "🔎 Resolve the pull request"
        id: pr
        if: steps.command.outputs.proceed == 'true'
        run: |
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json headRefOid,headRefName,baseRefName,isCrossRepository > "${RUNNER_TEMP}/pr.json"
          {
            echo "head_sha=$(jq -r '.headRefOid' "${RUNNER_TEMP}/pr.json")"
            echo "head_branch=$(jq -r '.headRefName' "${RUNNER_TEMP}/pr.json")"
            echo "base_branch=$(jq -r '.baseRefName' "${RUNNER_TEMP}/pr.json")"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Sonar analysis of #${PR_NUMBER}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Head commit | \`$(jq -r '.headRefOid' "${RUNNER_TEMP}/pr.json")\` |"
            echo "| Head branch | \`$(jq -r '.headRefName' "${RUNNER_TEMP}/pr.json")\` |"
            echo "| Base branch | \`$(jq -r '.baseRefName' "${RUNNER_TEMP}/pr.json")\` |"
            echo "| From a fork | $(jq -r '.isCrossRepository' "${RUNNER_TEMP}/pr.json") |"
            echo "| Triggered by | @${GITHUB_ACTOR} |"
          } >> "$GITHUB_STEP_SUMMARY"

  sonar:
    name: "sonar"
    needs: authorize
    if: needs.authorize.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # A comment on a pull request is an issue comment, so the acknowledgement
      # step needs `issues: write` for the reaction endpoint as well as
      # `pull-requests: write` for `gh pr comment`.
      issues: write
      pull-requests: write
    env:
      TESTCONTAINERS_RYUK_DISABLED: true
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.issue.number }}
    steps:
      - name: "💬 Acknowledge the comment"
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        env:
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" \
            -f content='eyes'
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Running Sonar analysis on \`${HEAD_SHA}\`: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      # https://github.com/actions/virtual-environments/issues/709
      - name: Remove system JDKs
        run: |
          sudo rm -rf /usr/lib/jvm/*
          unset JAVA_HOME
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v '/usr/lib/jvm' | paste -sd:)

      - name: "🗑 Free disk space"
        run: |
         sudo rm -rf "/usr/local/share/boost"
         sudo rm -rf "$AGENT_TOOLSDIRECTORY"
         sudo rm -rf "/opt/ghc"
         sudo rm -rf "/usr/share/dotnet"
         sudo rm -rf "/usr/local/lib/android"
         sudo apt-get clean
         df -h

      # Checked out by commit rather than by refs/pull/N/head so that the analysed
      # code is exactly what the authorize job recorded, even if the contributor
      # pushes again while the build is in flight.
      - name: "📥 Checkout the pull request"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: "🔧 Setup GraalVM CE"
        uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1
        with:
          distribution: 'graalvm'
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🔧 Setup Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: "❓ Optional setup step"
        run: |
          [ -f ./setup.sh ] && ./setup.sh || [ ! -f ./setup.sh ]

      - name: "🛠 Build with Gradle"
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
          DEVELOCITY_CACHE_USERNAME: ${{ secrets.GRADLE_ENTERPRISE_CACHE_USERNAME }}
          DEVELOCITY_CACHE_PASSWORD: ${{ secrets.GRADLE_ENTERPRISE_CACHE_PASSWORD }}
          GH_TOKEN_PUBLIC_REPOS_READONLY: ${{ secrets.GH_TOKEN_PUBLIC_REPOS_READONLY }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
        run: |
          ./gradlew check jacocoReport --no-daemon --continue

      # Analysis is a second Gradle invocation rather than `check jacocoReport
      # sonar` in one, matching gradle.yml, for two reasons. `sonar` needs
      # `--no-parallel`, and applying that to the whole build would serialise the
      # entire test suite. And SONAR_TOKEN would otherwise be exported to every
      # test in the pull request under analysis, rather than only to the scanner.
      # The repeated configuration time is the lesser cost.
      #
      # The pull request coordinates have to be passed explicitly: this is not a
      # `pull_request` event, so the scanner's own CI detection would otherwise
      # analyse this as a branch build of the default branch.
      - name: "🔎 Run static analysis"
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
          DEVELOCITY_CACHE_USERNAME: ${{ secrets.GRADLE_ENTERPRISE_CACHE_USERNAME }}
          DEVELOCITY_CACHE_PASSWORD: ${{ secrets.GRADLE_ENTERPRISE_CACHE_PASSWORD }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          HEAD_BRANCH: ${{ needs.authorize.outputs.head_branch }}
          BASE_BRANCH: ${{ needs.authorize.outputs.base_branch }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: |
          ./gradlew sonar --no-parallel --continue \
            -Dsonar.pullrequest.key="${PR_NUMBER}" \
            -Dsonar.pullrequest.branch="${HEAD_BRANCH}" \
            -Dsonar.pullrequest.base="${BASE_BRANCH}" \
            -Dsonar.scm.revision="${HEAD_SHA}"

      - name: "❓ Optional cleanup step"
        if: always()
        run: |
          [ -f ./cleanup.sh ] && ./cleanup.sh || [ ! -f ./cleanup.sh ]
