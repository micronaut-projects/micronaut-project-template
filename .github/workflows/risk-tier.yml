# WARNING: Do not edit this file directly. Instead, go to:
#
# https://github.com/micronaut-projects/micronaut-project-template/tree/master/.github/workflows
#
# and edit them there. Note that it will be sync'ed to all the Micronaut repos
name: Risk tier
# Labels each pull request with its risk tier (risk-tier: T0, T1 or T2), classified by TypeSafe's Jev model through
# .github/scripts/risk-tier.py, and its AI use (ai-use: none, assisted or agent-generated) as declared. The rules are in
# .github/risk-tiers.global.toml (synced) and the repository's own .github/risk-tiers.toml (optional, not synced). A
# change under a T2 path, a T2 label such as type: breaking, or a declared API change is always T2. Relabelling reclassifies a pull request: labels added by anyone else are kept. The check fails when the
# tier declared in the pull request description is lower than the classified one, or when Jev cannot be reached. The
# tiers are described in MAINTAINING.md, under "Risk tiers and AI disclosure".
#
# Jev's API key is the TYPESAFE_API_KEY organisation secret. Jev receives the pull request title, description, labels,
# changed file names with line counts, and the changed lines of main source files, read through the GitHub API.
#
# It runs on pull_request_target so that it can label pull requests from forks. It must never check out or run
# pull request code: the checkout below is the base branch, and the changed paths come from the GitHub API.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

concurrency:
  group: risk-tier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  risk-tier:
    name: risk-tier
    # Label events caused by this workflow's own token do not start new runs, so the job only reacts
    # to label changes made by people or other automation.
    if: >-
      github.repository_owner == 'micronaut-projects' &&
      (!contains(fromJSON('["labeled","unlabeled"]'), github.event.action) ||
       startsWith(github.event.label.name, 'risk-tier: ') ||
       startsWith(github.event.label.name, 'ai-use: ') ||
       github.event.label.name == 'type: breaking')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: "📥 Checkout base branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The base branch, never the pull request head.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/risk-tier.py
            .github/risk-tiers.global.toml
            .github/risk-tiers.toml
          sparse-checkout-cone-mode: false
      - name: "🏷 Compute and label the risk tier"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python3 .github/scripts/risk-tier.py event
